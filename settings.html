<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Page</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #f4f4f4;
            height: 100vh;
        }

        /* Sidebar styling */
        .sidebar {
            width: 250px;
            background-color: #333;
            color: white;
            padding-top: 20px;
            height: 100vh;
            position: fixed;
            left: 0;
        }
        .sidebar h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 40px;
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 15px;
            text-decoration: none;
            text-align: center;
            font-size: 18px;
            border-bottom: 1px solid #444;
        }
        .sidebar a:hover {
            background-color: #575757;
        }

        /* Settings page content */
        .settings-content {
            margin-left: 250px;
            padding: 20px;
            width: 100%;
        }

        /* Form styles */
        .settings-form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .settings-form h2 {
            text-align: center;
            color: #333;
        }
        .settings-form label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
        }
        .settings-form input,
        .settings-form select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .settings-form button {
            width: 100%;
            padding: 10px;
            background-color: #0072ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .settings-form button:hover {
            background-color: #005bb5;
        }

        /* Footer for logout or other links */
        .footer {
            text-align: center;
            margin-top: 20px;
        }

        .footer a {
            text-decoration: none;
            color: #0072ff;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .settings-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Dashboard</h2>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <a href="logout.html">Log Out</a>
    </div>

    <!-- Settings Content -->
    <div class="settings-content">
        <div class="settings-form">
            <h2>Account Settings</h2>
            <form action="update-settings.html" method="POST">

                <!-- Email Section -->
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="johndoe@example.com" required>

                <!-- Password Section -->
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter New Password">

                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm New Password">

                <!-- Notifications Settings -->
                <label for="notifications">Notifications</label>
                <select id="notifications" name="notifications">
                    <option value="enabled">Enabled</option>
                    <option value="disabled">Disabled</option>
                </select>

                <!-- Privacy Settings -->
                <label for="privacy">Privacy Settings</label>
                <select id="privacy" name="privacy">
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                    <option value="friends-only">Friends Only</option>
                </select>

                <!-- Submit Button -->
                <button type="submit">Save Changes</button>
            </form>
        </div>

        <!-- Footer with Log Out Link -->
        <div class="footer">
            <p>Want to log out? <a href="logout.html">Log Out</a></p>
        </div>
    </div>

</body>
</html>
