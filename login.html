<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>

  <!-- ✅ Firebase SDKs (required for auth) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>

  <!-- ✅ Your Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCPWor-XEXRLqeuCVOvgEtcLhluAR0JMmg",
      authDomain: "an-html-web.firebaseapp.com",
      projectId: "an-html-web",
      storageBucket: "an-html-web.appspot.com",
      messagingSenderId: "631346630521",
      appId: "1:631346630521:web:444c57b3882100ab63e9a8"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    .login-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 300px;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-container label {
      font-size: 14px;
      margin-bottom: 5px;
      display: block;
    }
    .login-container input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .login-container button {
      width: 100%;
      padding: 10px;
      background-color: #0072ff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .login-container button:hover {
      background-color: #005bb5;
    }
    .login-container .footer {
      text-align: center;
      margin-top: 15px;
    }
    .google-login {
      background-color: #db4437;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Login</h2>
    <form action="dashboard.html" method="POST">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter Username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter Password" required>

      <button type="submit">Login</button>
    </form>

    <!-- ✅ Google Login Button -->
    <button class="google-login" onclick="loginWithGoogle()">Login with Google</button>

    <div class="footer">
      <p>Don't have an account? <a href="register.html">Sign Up</a></p>
    </div>
  </div>

  <!-- ✅ Google Login Script -->
  <script>
    const auth = firebase.auth();

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          alert("Welcome, " + user.displayName);
        })
        .catch((error) => {
          alert("Login failed: " + error.message);
        });
    }
  </script>
</body>
</html>
