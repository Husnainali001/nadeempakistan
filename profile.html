<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            background-color: #f4f4f4;
            height: 100vh;
        }

        /* Sidebar styling */
        .sidebar {
            width: 250px;
            background-color: #333;
            color: white;
            padding-top: 20px;
            height: 100vh;
            position: fixed;
            left: 0;
        }
        .sidebar h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 40px;
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 15px;
            text-decoration: none;
            text-align: center;
            font-size: 18px;
            border-bottom: 1px solid #444;
        }
        .sidebar a:hover {
            background-color: #575757;
        }

        /* Profile page content */
        .profile-content {
            margin-left: 250px;
            padding: 20px;
            width: 100%;
        }

        /* Profile Picture */
        .profile-picture {
            text-align: center;
            margin-bottom: 30px;
        }
        .profile-picture img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #0072ff;
        }

        /* Form styles */
        .profile-form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .profile-form h2 {
            text-align: center;
            color: #333;
        }
        .profile-form label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
        }
        .profile-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .profile-form button {
            width: 100%;
            padding: 10px;
            background-color: #0072ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .profile-form button:hover {
            background-color: #005bb5;
        }

        /* Footer for logout or other links */
        .footer {
            text-align: center;
            margin-top: 20px;
        }

        .footer a {
            text-decoration: none;
            color: #0072ff;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .profile-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Dashboard</h2>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <a href="logout.html">Log Out</a>
    </div>

    <!-- Profile Content -->
    <div class="profile-content">
        <div class="profile-picture">
            <!-- Placeholder Profile Picture -->
            <img src="https://via.placeholder.com/150" alt="Profile Picture">
            <h3>John Doe</h3>
        </div>

        <!-- Profile Form -->
        <div class="profile-form">
            <h2>Update Profile</h2>
